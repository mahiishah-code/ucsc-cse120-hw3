name: slugguide
services:
  - name: api
    github:
      repo: mahiishah-code/ucsc-cse120-hw3
      branch: main
    dockerfile_path: ./Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    build_command: ""
    run_command: "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMMA_MODEL
        scope: RUN_TIME
        value: gemma-4-26b-a4b-it
      - key: PORT
        scope: RUN_TIME
        value: "8000"
